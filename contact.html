
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <title>CONTACT — BLACKSHEEP</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      padding: 32px 7%;
    }

    header {
      display: flex;
      justify-content: space-between;
      color: #AAAAAA;
      font-size: 12px;
      letter-spacing: 2px;
      .home-logo {
        display: block;
        line-height: 0;
      }      
      .home-logo img {
        display: block;
        height: 32px;
        width: auto;
        max-width: 180px;
        object-fit: contain;
      }
    }

    main {
      margin: auto 0;
      padding: 100px 0;
    }

    h1 {
      font-size: clamp(48px, 9vw, 100px);
      letter-spacing: -4px;
      margin: 0 0 20px;
    }

    .description {
      color: #AAAAAA;
      font-size: 15px;
      margin-bottom: 60px;
    }

    .label {
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .email {
      font-size: clamp(16px, 3vw, 24px);
      overflow-wrap: anywhere;
    }

    footer { margin-top: auto; }

    footer a {
      color: #AAAAAA;
      font-size: 12px;
      text-decoration: none;
      letter-spacing: 1px;
    }

    footer a:hover { color: #fff; }
    
    .contact-header {
      align-items: center;
      position: relative;
    }
    
    .contact-title {
      margin-left: auto;
      margin-right: 28px;
    }
    
    .menu-toggle {
      width: 28px;
      height: 28px;
      padding: 4px 0;
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
    }
    
    .menu-toggle span {
      display: block;
      width: 24px;
      height: 2px;
      background: #fff;
    }
    
    .contact-nav {
      display: none;
      position: absolute;
      top: 75px;
      right: 7%;
      z-index: 10;
      min-width: 180px;
      padding: 18px 22px;
      background: #111;
      border: 1px solid #333;
    }
    
    .contact-nav.open {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    
    .contact-nav a {
      color: #aaa;
      font-size: 12px;
      letter-spacing: 2px;
      text-decoration: none;
    }
    
    .contact-nav a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- <header>
    <span>BLACKSHEEP</span>
    <span>CONTACT</span>
  </header> -->
  <!-- <header>
    <a class="home-logo" href="index.html" aria-label="Back to home">
      <img src="logo.png" alt="BLACKSHEEP">
    </a>
    <span>CONTACT</span>
  </header> -->
  
  <header class="contact-header">
    <a class="home-logo" href="index.html" aria-label="Back to home">
      <img src="logo.png" alt="BLACKSHEEP">
    </a>
  
    <span class="contact-title">CONTACT</span>
  
    <button class="menu-toggle" id="menuToggle"
            aria-label="Open navigation"
            aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>
  
  <nav class="contact-nav" id="contactNav">
    <a href="index.html#home">HOME</a>
    <a href="index.html#about">ABOUT</a>
    <a href="index.html#busking">VIDEO</a>
    <a href="index.html#gallery">GALLERY</a>
    <a href="contact.html">CONTACT</a>
  </nav>


  <main>
    <h1>LET'S TALK.</h1>
    <p class="description">
      For bookings &amp; business inquiries.
    </p>
    <p class="label">GET IN TOUCH</p>
    <!-- <p class="email">contact@blacksheep.co.kr&nbsp;&nbsp;</p> -->
    <div class="email-copy">
      <a>
      contact@blacksheep.co.kr&nbsp;
      </a>
      <span class="copy-icon-wrap">
        <img
          id="copyEmail"
          src="./copy%20icon.png"
          alt="이메일 복사"
          width="22"
          height="22"
          role="button"
          tabindex="0"
        >
      </span>
    </div>
  </main>

  <footer>
    <a href="index.html">← BACK TO HOME</a>
  </footer>
  <script>
    const menuToggle = document.getElementById('menuToggle');
    const contactNav = document.getElementById('contactNav');
  
    menuToggle.addEventListener('click', () => {
      const isOpen = contactNav.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', isOpen);
    });
  
    document.addEventListener('click', (event) => {
      if (!menuToggle.contains(event.target) &&
          !contactNav.contains(event.target)) {
        contactNav.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
</body>
</html>
