
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT — BLACKSHEEP</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      padding: 32px 7%;
    }

    header {
      display: flex;
      justify-content: space-between;
      color: #AAAAAA;
      font-size: 12px;
      letter-spacing: 2px;
      .home-logo {
        display: block;
        line-height: 0;
      }      
      .home-logo img {
        display: block;
        height: 32px;
        width: auto;
        max-width: 180px;
        object-fit: contain;
      }
    }

    main {
      margin: auto 0;
      padding: 100px 0;
    }

    h1 {
      font-size: clamp(48px, 9vw, 100px);
      letter-spacing: -4px;
      margin: 0 0 20px;
    }

    .description {
      color: #AAAAAA;
      font-size: 15px;
      margin-bottom: 60px;
    }

    .label {
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .email {
      font-size: clamp(16px, 3vw, 24px);
      overflow-wrap: anywhere;
    }

    footer { margin-top: auto; }

    footer a {
      color: #AAAAAA;
      font-size: 12px;
      text-decoration: none;
      letter-spacing: 1px;
    }

    footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <!-- <header>
    <span>BLACKSHEEP</span>
    <span>CONTACT</span>
  </header> -->
  <header>
    <a class="home-logo" href="index.html" aria-label="Back to home">
      <img src="logo.png" alt="BLACKSHEEP">
    </a>
    <span>CONTACT</span>
  </header>

  <main>
    <h1>LET'S TALK.</h1>
    <p class="description">
      For bookings &amp; business inquiries.
    </p>
    <p class="label">GET IN TOUCH</p>
    <p class="email">contact@blacksheep.co.kr</p>
  </main>

  <footer>
    <a href="index.html">← BACK TO HOME</a>
  </footer>
</body>
</html>
